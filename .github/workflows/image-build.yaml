name: Build and scan image

on:
  workflow_call:
    inputs:
      app:
        description: Application image to build and scan
        required: true
        type: string
  workflow_dispatch:
    inputs:
      app:
        description: Application image to build and scan
        required: true
        type: choice
        options:
          - api
          - ui
          - docs

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    name: Build and scan ${{ inputs.app }} image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        env:
          APP: ${{ inputs.app }}
        run: >-
          docker buildx build
          --file "apps/${APP}/Dockerfile"
          --tag "flag-controller-${APP}:scan"
          --output "type=docker,dest=${RUNNER_TEMP}/image.tar"
          .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          cache: true
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@e8893c57a1f3a2b659b6b55564fdfdbbd2982911 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-${{ inputs.app }}